[package]
name = "noizybeast"
version = "0.1.0"
description = "NOIZYBEAST.IDE — the studio IDE for the NOIZY empire (Tauri + RustDesk)"
authors = ["Robert Stephen Plowman <noizyfish@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "noizybeast_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"
rosc = "0.10"
thiserror = "2"

# `core` is the pure-Rust part (14-bit MIDI, OSC, consent-compatible JSON, RustDesk URL building) — tested without Tauri.
[features]
default = []
