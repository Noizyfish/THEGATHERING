# NOIZY Empire self-hosted stack: Forgejo (git mirror) + n8n (automation) + Postgres.
#   cp empire/stack/.env.example empire/stack/.env   # fill values
#   docker compose -f empire/stack/docker-compose.yml up -d
# Forgejo: http://localhost:3000    n8n: http://localhost:5678
name: noizy-empire

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:9
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__server__ROOT_URL: ${FORGEJO_URL:-http://localhost:3000}/
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__mirror__ENABLED: "true"
      FORGEJO__mirror__DEFAULT_INTERVAL: ${MIRROR_INTERVAL:-8h}
      FORGEJO__migrations__ALLOWED_DOMAINS: github.com
      FORGEJO__service__DISABLE_REGISTRATION: "true"
    volumes:
      - forgejo-data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:22"

  n8n-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD}
      POSTGRES_DB: n8n
    volumes:
      - n8n-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      GENERIC_TIMEZONE: ${TZ:-America/Toronto}
      # Values the empire-thru-line workflow reads via $env.*
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      FORGEJO_URL: http://forgejo:3000
      FORGEJO_TOKEN: ${FORGEJO_TOKEN}
      FORGEJO_OWNER: ${FORGEJO_OWNER:-noizy}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      EMPIRE_MANIFEST_URL: ${EMPIRE_MANIFEST_URL:-https://raw.githubusercontent.com/Noizyfish/THEGATHERING/main/empire/repos.json}
      EMPIRE_LOCAL_INVENTORY_URL: ${EMPIRE_LOCAL_INVENTORY_URL:-https://raw.githubusercontent.com/Noizyfish/THEGATHERING/main/empire/local-inventory.json}
      EMPIRE_GOOGLE_INVENTORY_URL: ${EMPIRE_GOOGLE_INVENTORY_URL:-https://raw.githubusercontent.com/Noizyfish/THEGATHERING/main/empire/google-inventory.json}
      EMPIRE_HUB: ${EMPIRE_HUB:-Noizyfish/THEGATHERING}
      INTENT_SHARED_SECRET: ${INTENT_SHARED_SECRET:?set INTENT_SHARED_SECRET}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n:/workflows:ro
    ports:
      - "5678:5678"

volumes:
  forgejo-data:
  n8n-db:
  n8n-data:
